# -------------------------------------------------------------------
# Client Deploy → Vercel — triggered on push to main
# Only runs when medease-client/ files change
# Only deploys on merge commits
# -------------------------------------------------------------------
name: Client Deploy → Vercel

on:
  push:
    branches: [main]
    # paths:
    #   - 'medease-client/**'

concurrency:
  group: client-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# env:
#   NODE_ENV: production

defaults:
  run:
    working-directory: medease-client

jobs:
  deploy:
    if: contains(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: medease-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint validation
        run: npm run lint

      - name: Vite build
        run: npm run build

      - name: Trigger Vercel deploy hook
        run: curl -X POST "${{ secrets.VERCEL_CLIENT_DEPLOY_HOOK }}"

      - name: Deployment summary
        run: |
          echo "✅ Client deployed successfully."
          echo "Checks passed:"
          echo "  - lint"
          echo "  - build"
